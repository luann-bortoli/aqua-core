services:

  quibenne-db:
    image: mysql:8.0
    container_name: quibenne-db
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: quibenne
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: quibenne
      MYSQL_PASSWORD: quibenne

    ports:
      - "3309:3306"

    volumes:
      - mysql_data:/var/lib/mysql

  quibenne-api:
    container_name: quibenne-api

    build:
      context: ./backend
      dockerfile: Dockerfile

    depends_on:
      - quibenne-db

    env_file:
      - .env

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://quibenne-db:3306/quibenne?createDatabaseIfNotExist=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: quibenne
      SPRING_DATASOURCE_PASSWORD: quibenne
      RESEND_API_KEY: ${RESEND_API_KEY}
      MAIL_FROM: ${MAIL_FROM}
      FRONTEND_URL: ${FRONTEND_URL}

    ports:
      - "8089:8080"

    restart: unless-stopped

volumes:
  mysql_data: