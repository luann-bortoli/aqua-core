spring.application.name=quibenne

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:admin@aquacore.com}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:Aquacore37@}

resend.api-url=https://api.resend.com/emails
resend.api-key=${RESEND_API_KEY}
app.mail.from=${MAIL_FROM}
app.frontend.url=${FRONTEND_URL:http://localhost:3000}